name: Build unsigned IPA

# Builds the app on a GitHub macOS machine, publishes the UNSIGNED .ipa as a release asset and
# writes a SideStore/AltStore source file next to it. SideStore on the phone signs the app with your
# own Apple ID.
#
# Permanent links (they always point at the newest release):
#   source for SideStore:  https://github.com/<owner>/<repo>/releases/latest/download/source.json
#   the .ipa itself:       https://github.com/<owner>/<repo>/releases/latest/download/G2Bridge.ipa
# Bump MARKETING_VERSION and CURRENT_PROJECT_VERSION in project.yml for each build: SideStore offers an
# update when the version changes, and refuses an .ipa whose build number differs from the source's.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail  # without this, tee/tail would hide xcodebuild's failure
          xcodebuild -project G2Bridge.xcodeproj -scheme G2Bridge \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 60

      - name: Package the IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/G2Bridge.app
          test -f "$APP/G2Bridge" || { echo "no executable in the app: the build failed"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr G2Bridge.ipa Payload
          ls -la G2Bridge.ipa

      - name: Write the SideStore source
        env:
          REPO: ${{ github.repository }}
        run: |
          export VERSION=$(grep -E '^ +MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          export BUILD=$(grep -E '^ +CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          export SIZE=$(stat -f%z G2Bridge.ipa)
          export DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export OWNER=${REPO%%/*}
          python3 - <<'PY'
          import json, os
          v, repo = os.environ["VERSION"], os.environ["REPO"]
          url = f"https://github.com/{repo}/releases/download/v{v}/G2Bridge.ipa"
          version = {"version": v, "buildVersion": os.environ["BUILD"], "date": os.environ["DATE"], "downloadURL": url,
                     "size": int(os.environ["SIZE"]), "minOSVersion": "26.0"}
          app = {
              "name": "G2 Bridge",
              "bundleIdentifier": "com.jsrobles.g2bridge",
              "developerName": os.environ["OWNER"],
              "subtitle": "Apple speech and translation for the G2 glasses app",
              "localizedDescription": "Companion to JP Live Translate: recognizes Japanese with Apple's on-device speech recognition and translates it to English, then sends it to the glasses app on this phone.",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/design/icon-1024.png",
              # AltStore/SideStore read either the newer 'versions' list or these top-level fields.
              "versions": [version],
              **{k: version[k] for k in ("version", "versionDate", "size", "downloadURL") if k in version},
              "versionDate": version["date"],
          }
          source = {"name": "G2 Bridge", "identifier": "com.jsrobles.g2bridge.source", "apps": [app], "news": []}
          json.dump(source, open("source.json", "w"), indent=2)
          PY
          cat source.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^ +MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "G2 Bridge $VERSION" --notes "Unsigned build $VERSION (commit ${GITHUB_SHA::7})." --latest
          gh release upload "$TAG" G2Bridge.ipa source.json --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
